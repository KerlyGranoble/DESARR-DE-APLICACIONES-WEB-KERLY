{% extends "base.html" %}
{% block title %}Inicio - Tienda Virtual Online{% endblock %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 text-center">
  <h1 class="display-5 fw-bold">Tienda Virtual Online</h1>
  <p class="fs-4">Sitio web para la venta de productos por Internet</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">Ir al panel</a>
  {% else %}
    <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">Iniciar sesión</a>
    <a href="{{ url_for('registro') }}" class="btn btn-outline-secondary btn-lg">Registrarse</a>
  {% endif %}
</div>
{% endblock %}
